<!DOCTYPE html>
<html lang="en">
<head>

    <title>Happy Birthday Liam!</title>

    <style>
        body {
            margin: 0;
            background: #111111;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-top: 50px;
        }

        img {
            max-width: 90%;
            height: auto;
        }

        p {
            max-width: 700px;
            margin: 30px auto;

        .moon-section img {

            position: absolute;

            left: 0;
        }

</head>

<body>

    <img src="IMG_20260511_111228.jpg" alt="A special photo">

    <p>

    </p>

    <div class="moon-section">

</html>
